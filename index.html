<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Método Cicatriz - Plataforma artística de Candela Gencarelli. Una web que no funciona como archivo exhaustivo sino como experiencia situada y contingente. Procesos que aparecen parcial y aleatoriamente, reflejando la práctica artística como investigación en proceso. Método Cicatriz - Artistic platform by Candela Gencarelli. A website that functions not as an exhaustive archive but as a situated and contingent experience. Processes appear partially and at random, reflecting artistic practice as ongoing research."
    />
    <!-- favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link
      rel="preload"
      href="assets/fonts/C_tesis-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/fonts/DINNextLTPro-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/images/leyenda-home-es.webp"
      as="image"
      fetchpriority="high"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/navigation.css" />
    <link rel="stylesheet" href="css/home.css" />
    <title
      data-es="Método Cicatriz • Candela Gencarelli"
      data-en="Método Cicatriz • Candela Gencarelli"
    >
      Método Cicatriz • Candela Gencarelli
    </title>
  </head>
  <body class="page-home">
    <div id="random-background" class="background-image-container"></div>

    <nav class="navigation">
      <div class="nav-left">
        <h1 class="artist-name">
          <span class="strikethrough">Método</span> Cicatriz
        </h1>
      </div>

      <div class="nav-right">
        <a href="./pages/bio.html" data-es="BIO" data-en="BIO">BIO</a>
        <div class="language-toggle">
          <span class="lang-option active" data-lang="es">ES</span>
          <span class="separator">/</span>
          <span class="lang-option" data-lang="en">EN</span>
        </div>
      </div>
    </nav>

    <main class="home-layout">
      <div class="home-content">
        <div class="vertical-banner">
          <img
            id="leyenda-home"
            class="leyenda-image lang-es"
            src="assets/images/leyenda-home-es.webp"
            data-src-es="assets/images/leyenda-home-es.webp"
            data-src-en="assets/images/leyenda-home-en.webp"
            alt="Esta web no soy yo, es una forma de entrar a mi práctica artística"
            data-alt-es="Esta web no soy yo, es una forma de entrar a mi práctica artística"
            data-alt-en="This website isn't me, it's a way into my artistic practice"
            width="1200"
            height="502"
            decoding="async"
            fetchpriority="high"
          />

          <button
            id="random-pdf-btn"
            class="open-button"
            aria-label="Abrir proceso"
          >
            <picture>
              <!-- Versión mobile -->
              <source
                media="(max-width: 768px)"
                srcset="assets/images/boton-abrir-mobile-es.webp"
                data-src-es="assets/images/boton-abrir-mobile-es.webp"
                data-src-en="assets/images/boton-abrir-mobile-en.webp"
              />
              <!-- Versión desktop (actual) -->
              <img
                id="boton-abrir"
                class="boton-image lang-es"
                src="assets/images/boton-abrir-es.webp"
                data-src-es="assets/images/boton-abrir-es.webp"
                data-src-en="assets/images/boton-abrir-en.webp"
                alt="Abrir proceso"
                data-alt-es="Abrir proceso"
                data-alt-en="Open a process"
                width="1524"
                height="289"
                decoding="async"
                loading="lazy"
              />
            </picture>
          </button>

          <button
            type="button"
            id="process-map-btn"
            class="process-map-entry"
            data-external-loader="true"
            data-es="Mapa de procesos"
            data-en="Process map"
          >
            Mapa de procesos
          </button>

          <footer>
            <p
              class="footer-text"
              data-es="Cicatriz no clasifica obras terminadas: cartografía procesos de arte-investigación. Esta web fue creada y es mantenida a diario por Nicolás de la Cruz y Candela Gencarelli en del Pórtico estudio."
              data-en="Cicatriz does not classify finished works: it maps art-research processes. This site was created and is maintained daily by Nicolás de la Cruz and Candela Gencarelli at del Pórtico estudio."
            >
              Cicatriz no clasifica obras terminadas: cartografía procesos de
              arte-investigación. Esta web fue creada y es mantenida a diario
              por Nicolás de la Cruz y Candela Gencarelli en del Pórtico
              estudio.
            </p>
            <a
              class="instagram-link"
              href="https://www.instagram.com/candegenca/"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img
                src="assets/images/instagram-icon.webp"
                alt="Logo Instagram"
                width="48"
                height="48"
                loading="lazy"
                decoding="async"
              />
            </a>
          </footer>
        </div>
      </div>
    </main>

    <script defer src="js/translations.js"></script>
    <script defer src="js/random-background.js"></script>
    <script defer src="js/pdf-link-layer.js"></script>
    <script defer src="js/random-pdf.js"></script>
    <script defer src="js/embed-viewer.js"></script>
    <script defer src="main.js"></script>
    <script>
      (function () {
        var loaded = false;
        function loadMap() {
          if (loaded) return;
          loaded = true;
          var link = document.createElement("link");
          link.id = "process-graph-css";
          link.rel = "stylesheet";
          link.href = "css/process-graph.css";
          document.head.appendChild(link);
          var script = document.createElement("script");
          script.src = "js/process-graph.js";
          script.onload = function () {
            if (window.ProcessGraph && typeof window.ProcessGraph.open === "function") {
              window.ProcessGraph.open();
            }
          };
          document.body.appendChild(script);
        }
        function bind() {
          var btn = document.getElementById("process-map-btn");
          if (!btn) return;
          btn.addEventListener(
            "pointerenter",
            function () {
              if (document.getElementById("process-graph-css")) return;
              var link = document.createElement("link");
              link.id = "process-graph-css";
              link.rel = "stylesheet";
              link.href = "css/process-graph.css";
              document.head.appendChild(link);
            },
            { once: true },
          );
          btn.addEventListener("click", function (e) {
            e.preventDefault();
            if (window.ProcessGraph && typeof window.ProcessGraph.open === "function") {
              window.ProcessGraph.open();
              return;
            }
            loadMap();
          });
        }
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", bind);
        } else {
          bind();
        }
      })();
    </script>
  </body>
</html>
