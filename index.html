<!doctype html>
<html lang="es">

    />
    <link

      href="assets/images/leyenda-home-es.webp"

      fetchpriority="high"

      data-en="Método Cicatriz • Candela Gencarelli"

      Método Cicatriz • Candela Gencarelli

  <body class="page-home">
    <div id="random-background" class="background-image-container"></div>

    <nav class="navigation">
      <div class="nav-left">
        <h1 class="artist-name">
          <span class="strikethrough">Método</span> Cicatriz
        </h1>
      </div>

      <div class="nav-right">
        <a href="./pages/bio.html" data-es="BIO" data-en="BIO">BIO</a>
        <div class="language-toggle">
          <span class="lang-option active" data-lang="es">ES</span>
          <span class="separator">/</span>
          <span class="lang-option" data-lang="en">EN</span>

      </div>
    </nav>

    <main class="home-layout">
      <div class="home-content">
        <div class="vertical-banner">
          <img
            id="leyenda-home"
            class="leyenda-image lang-es"
            src="assets/images/leyenda-home-es.webp"
            data-src-es="assets/images/leyenda-home-es.webp"
            data-src-en="assets/images/leyenda-home-en.webp"
            alt="Esta web no soy yo, es una forma de entrar a mi práctica artística"
            data-alt-es="Esta web no soy yo, es una forma de entrar a mi práctica artística"
            data-alt-en="This website isn't me, it's a way into my artistic practice"
            width="1200"
            height="502"
            decoding="async"
            fetchpriority="high"
          />

          <button
            id="random-pdf-btn"
            class="open-button"
            aria-label="Abrir proceso"
          >
            <picture>
              <source
                media="(min-width: 769px)"
                srcset="assets/images/boton-abrir-es.webp"
                data-src-es="assets/images/boton-abrir-es.webp"
                data-src-en="assets/images/boton-abrir-en.webp"
              />
              <img
                id="boton-abrir"
                class="boton-image lang-es"
                src="assets/images/boton-abrir-mobile-es.webp"
                data-src-es="assets/images/boton-abrir-mobile-es.webp"
                data-src-en="assets/images/boton-abrir-mobile-en.webp"
                alt="Abrir proceso"
                data-alt-es="Abrir proceso"
                data-alt-en="Open a process"
                width="315"
                height="60"
                decoding="async"
                loading="lazy"
              />
            </picture>
          </button>

          <button
            type="button"
            id="process-map-btn"
            class="process-map-entry"
            data-external-loader="true"
            data-es="Mapa de procesos"
            data-en="Process map"
          >
            Mapa de procesos
          </button>

          <footer>
            <p
              class="footer-text"
              data-es="Cicatriz no clasifica obras terminadas: cartografía procesos de arte-investigación. Esta web fue creada y es mantenida a diario por Nicolás de la Cruz y Candela Gencarelli en del Pórtico estudio."
              data-en="Cicatriz does not classify finished works: it maps art-research processes. This site was created and is maintained daily by Nicolás de la Cruz and Candela Gencarelli at del Pórtico estudio."
            >
              Cicatriz no clasifica obras terminadas: cartografía procesos de
              arte-investigación. Esta web fue creada y es mantenida a diario
              por Nicolás de la Cruz y Candela Gencarelli en del Pórtico
              estudio.
            </p>
            <a
              class="instagram-link"
              href="https://www.instagram.com/candegenca/"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img
                src="assets/images/instagram-icon.webp"
                alt="Logo Instagram"
                width="48"
                height="48"
                loading="lazy"
                decoding="async"
              />
            </a>
          </footer>
        </div>
      </div>
    </main>

    <script defer src="js/random-background.js"></script>
    <script defer src="main.js"></script>
    <script>
      (function () {
        function loadScript(src) {
          return new Promise(function (resolve, reject) {
            if (document.querySelector('script[src="' + src + '"]')) {
              resolve();
              return;
            }
            var s = document.createElement("script");
            s.src = src;
            s.async = true;
            s.onload = function () {
              resolve();
            };
            s.onerror = reject;
            document.body.appendChild(s);
          });
        }

        var pdfStackPromise = null;
        function ensurePdfStack() {
          if (window.PdfModal) return Promise.resolve();
          if (pdfStackPromise) return pdfStackPromise;
          pdfStackPromise = loadScript("js/pdf-link-layer.js")
            .then(function () {
              return loadScript("js/embed-viewer.js");
            })
            .then(function () {
              return loadScript("js/random-pdf.js");
            });
          return pdfStackPromise;
        }

        var mapLoaded = false;
        function loadMap() {
          if (mapLoaded) return;
          mapLoaded = true;
          if (!document.getElementById("process-graph-css")) {
            var link = document.createElement("link");
            link.id = "process-graph-css";
            link.rel = "stylesheet";
            link.href = "css/process-graph.css";
            document.head.appendChild(link);
          }
          var script = document.createElement("script");
          script.src = "js/process-graph.js";
          script.onload = function () {
            if (
              window.ProcessGraph &&
              typeof window.ProcessGraph.open === "function"
            ) {
              window.ProcessGraph.open();
            }
          };
          document.body.appendChild(script);
        }

        function bind() {
          var pdfBtn = document.getElementById("random-pdf-btn");
          if (pdfBtn) {
            var warm = function () {
              ensurePdfStack().catch(function () {});
            };
            pdfBtn.addEventListener("pointerenter", warm, { once: true });
            pdfBtn.addEventListener("focus", warm, { once: true });
            pdfBtn.addEventListener("click", function (e) {
              e.preventDefault();
              e.stopPropagation();
              ensurePdfStack()
                .then(function () {
                  if (
                    window.PdfModal &&
                    typeof window.PdfModal.openRandom === "function"
                  ) {
                    window.PdfModal.openRandom();
                  }
                })
                .catch(function (err) {
                  console.error(err);
                });
            });
          }

          var mapBtn = document.getElementById("process-map-btn");
          if (!mapBtn) return;
          mapBtn.addEventListener(
            "pointerenter",
            function () {
              if (document.getElementById("process-graph-css")) return;
              var link = document.createElement("link");
              link.id = "process-graph-css";
              link.rel = "stylesheet";
              link.href = "css/process-graph.css";
              document.head.appendChild(link);
            },
            { once: true },
          );
          mapBtn.addEventListener("click", function (e) {
            e.preventDefault();
            if (
              window.ProcessGraph &&
              typeof window.ProcessGraph.open === "function"
            ) {
              window.ProcessGraph.open();
              return;
            }
            loadMap();
          });
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", bind);
        } else {
          bind();
        }
      })();
    </script>
  </body>
</html>
