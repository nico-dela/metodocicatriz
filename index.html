<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Método Cicatriz - Plataforma artística de Candela Gencarelli. Una web que no funciona como archivo exhaustivo sino como experiencia situada y contingente."
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link
      rel="preload"
      href="assets/fonts/C_tesis-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="assets/images/leyenda-home-es-720.webp"
      imagesrcset="assets/images/leyenda-home-es-720.webp 720w, assets/images/leyenda-home-es.webp 900w"
      imagesizes="(max-width: 768px) 92vw, min(88vw, 960px)"
      fetchpriority="high"
    />
    <link rel="stylesheet" href="css/home-critical.css" />
    <script src="js/theme.js"></script>
    <title
      data-es="Método Cicatriz • Candela Gencarelli"
      data-en="Método Cicatriz • Candela Gencarelli"
    >
      Método Cicatriz • Candela Gencarelli
    </title>
  </head>
  <body class="page-home">
    <div id="random-background" class="background-image-container"></div>

    <nav class="navigation">
      <div class="nav-left">
        <h1 class="artist-name">
          <span class="strikethrough">Método</span> Cicatriz
        </h1>
      </div>

      <div class="nav-right">
        <a href="./pages/bio.html" data-es="BIO" data-en="BIO">BIO</a>
        <button
          type="button"
          id="theme-toggle"
          class="theme-toggle"
          aria-label="Tema de color"
        ></button>
        <div class="language-toggle">
          <span class="lang-option active" data-lang="es">ES</span>
          <span class="separator">/</span>
          <span class="lang-option" data-lang="en">EN</span>
        </div>
      </div>
    </nav>

    <main class="home-layout">
      <div class="home-content">
        <div class="vertical-banner">
          <img
            id="leyenda-home"
            class="leyenda-image lang-es"
            src="assets/images/leyenda-home-es-720.webp"
            srcset="
              assets/images/leyenda-home-es-720.webp 720w,
              assets/images/leyenda-home-es.webp 900w
            "
            sizes="(max-width: 768px) 92vw, min(88vw, 960px)"
            data-src-es="assets/images/leyenda-home-es-720.webp"
            data-src-en="assets/images/leyenda-home-en-720.webp"
            data-srcset-es="assets/images/leyenda-home-es-720.webp 720w, assets/images/leyenda-home-es.webp 900w"
            data-srcset-en="assets/images/leyenda-home-en-720.webp 720w, assets/images/leyenda-home-en.webp 900w"
            alt="Esta web no soy yo, es una forma de entrar a mi práctica artística"
            data-alt-es="Esta web no soy yo, es una forma de entrar a mi práctica artística"
            data-alt-en="This website isn't me, it's a way into my artistic practice"
            width="900"
            height="376"
            decoding="async"
            fetchpriority="high"
          />

          <button
            id="random-pdf-btn"
            class="open-button"
            aria-label="Abrir proceso"
          >
            <picture>
              <source
                media="(min-width: 769px)"
                srcset="assets/images/boton-abrir-es.webp"
                data-src-es="assets/images/boton-abrir-es.webp"
                data-src-en="assets/images/boton-abrir-en.webp"
              />
              <img
                id="boton-abrir"
                class="boton-image lang-es"
                src="assets/images/boton-abrir-mobile-es.webp"
                data-src-es="assets/images/boton-abrir-mobile-es.webp"
                data-src-en="assets/images/boton-abrir-mobile-en.webp"
                alt="Abrir proceso"
                data-alt-es="Abrir proceso"
                data-alt-en="Open a process"
                width="315"
                height="60"
                decoding="async"
                loading="lazy"
              />
            </picture>
          </button>

          <button
            type="button"
            id="process-map-btn"
            class="process-map-entry"
            data-external-loader="true"
            data-es="Mapa de procesos"
            data-en="Process map"
          >
            Mapa de procesos
          </button>

          <footer>
            <p
              class="footer-text"
              data-es="Cicatriz no clasifica obras terminadas: cartografía procesos de arte-investigación. Esta web fue creada y es mantenida a diario por Nicolás de la Cruz y Candela Gencarelli en del Pórtico estudio."
              data-en="Cicatriz does not classify finished works: it maps art-research processes. This site was created and is maintained daily by Nicolás de la Cruz and Candela Gencarelli at del Pórtico estudio."
            >
              Cicatriz no clasifica obras terminadas: cartografía procesos de
              arte-investigación. Esta web fue creada y es mantenida a diario
              por Nicolás de la Cruz y Candela Gencarelli en del Pórtico
              estudio.
            </p>
            <a
              class="instagram-link"
              href="https://www.instagram.com/candegenca/"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img
                src="assets/images/instagram-icon.webp"
                alt="Logo Instagram"
                width="48"
                height="48"
                loading="lazy"
                decoding="async"
              />
            </a>
          </footer>
        </div>
      </div>
    </main>

    <script defer src="js/random-background.js"></script>
    <script defer src="main.js"></script>
    <script defer src="js/home-boot.js"></script>
  </body>
</html>
